<rect x="940.16125" y="261.5" width="79.67750000000001" height="18.5" fill="#ffffff" opacity="0.95"/>
<text x="980.0" y="274" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="600">valid input</text>
