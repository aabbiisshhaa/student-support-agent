<rect x="270.0" y="1280" width="900.0" height="72" rx="8" fill="#2e1f45" stroke="#7b5ea7" stroke-width="1.5"/>
<text x="720.0" y="1310.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">Student receives the grounded, cited retake report (T6)</text>
<text x="720.0" y="1330.8" font-size="11.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">Citation format: [Nakawa University Academic Handbook 2025/2026, s. 7, p. 4]</text>
<path d="M460.0,1226 L460.0,1280 " fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M980.0,1226 L980.0,1280 " fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="1398" width="6" height="36" fill="#2f7a97"/>
<text x="56" y="1414" font-size="16.5" font-weight="700" fill="#111827">3  ADMINISTRATIVE ESCALATION ROUTING — human hand-off</text>
<text x="56" y="1431" font-size="12" fill="#6b7280">Every ESCALATED run routes to exactly one staff queue, carrying the full AgentState (plan_history + tool_observations) per H-2</text>
<rect x="40.0" y="1450" width="452.0" height="172" rx="8" fill="#2e1f45" stroke="#7b5ea7" stroke-width="1.5"/>
<text x="56.0" y="1504.2" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">General Administration Queue</text>
<text x="56.0" y="1524.8" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">Department Administrator</text>
<text x="56.0" y="1542.2" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S1 · prohibited intent</text>
<text x="56.0" y="1559.8" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S4 · iteration limit reached</text>
<text x="56.0" y="1577.2" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S11 · unregistered tool, repeated</text>
<rect x="516.0" y="1450" width="452.0" height="172" rx="8" fill="#2e1f45" stroke="#7b5ea7" stroke-width="1.5"/>
<text x="532.0" y="1486.8" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">Timetable &amp; Registration Queue</text>
<text x="532.0" y="1507.2" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">Faculty Registrar / Head of Department</text>
<text x="532.0" y="1524.8" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S2 · clash, no clash-free option</text>
<text x="532.0" y="1542.2" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S5 · same tool failed twice / student not found</text>
<text x="532.0" y="1559.8" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S6 · missing or invalid course code</text>
<text x="532.0" y="1577.2" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S8 · admin-error clash (Form AR/7)</text>
<text x="532.0" y="1594.8" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S9 · outside registration window</text>
<rect x="992.0" y="1450" width="452.0" height="172" rx="8" fill="#2e1f45" stroke="#7b5ea7" stroke-width="1.5"/>
<text x="1008.0" y="1513.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">Academic Policy Queue</text>
<text x="1008.0" y="1533.5" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">Academic Policy reviewers</text>
<text x="1008.0" y="1551.0" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S3 · 4th attempt — discontinuation risk</text>
<text x="1008.0" y="1568.5" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S7 · no policy evidence found</text>
<rect x="1468.0" y="1450" width="452.0" height="172" rx="8" fill="#2e1f45" stroke="#7b5ea7" stroke-width="1.5"/>
<text x="1484.0" y="1521.8" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">General Support Queue</text>
<text x="1484.0" y="1542.2" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">Student Support Services</text>
<text x="1484.0" y="1559.8" font-size="11" font-weight="400" fill="#d9cdee" text-anchor="start">S10 · distress / urgency cues</text>
<path d="M1500.0,1226 L1500.0,1420 L266.0,1420 L266.0,1450 " fill="none" stroke="#b9453f" stroke-width="2" marker-end="url(#arrow-crimson)"/>
<path d="M1500.0,1226 L1500.0,1420 L742.0,1420 L742.0,1450 " fill="none" stroke="#b9453f" stroke-width="2" marker-end="url(#arrow-crimson)"/>
<path d="M1500.0,1226 L1500.0,1420 L1218.0,1420 L1218.0,1450 " fill="none" stroke="#b9453f" stroke-width="2" marker-end="url(#arrow-crimson)"/>
<path d="M1500.0,1226 L1500.0,1420 L1694.0,1420 L1694.0,1450 " fill="none" stroke="#b9453f" stroke-width="2" marker-end="url(#arrow-crimson)"/>
<rect x="40" y="1656" width="1880" height="110" rx="8" fill="#3f2a12" stroke="#a9742e" stroke-width="1.5"/>
<text x="58" y="1686.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">Hand-off rules</text>
<text x="58" y="1707.0" font-size="12" font-weight="400" fill="#f1e7d2" text-anchor="start">H-1 confirmation gate — a ticket is written only when student_confirmed == true; otherwise the run ends “escalated, awaiting confirmation”.</text>
<text x="58" y="1725.5" font-size="12" font-weight="400" fill="#f1e7d2" text-anchor="start">H-3 honest status — an escalated run never claims success.</text>
<text x="58" y="1744.0" font-size="12" font-weight="400" fill="#f1e7d2" text-anchor="start">H-4 no unilateral action — the agent only routes to a queue; it never changes a record itself.</text>
<text x="980.0" y="1800" font-size="11.5" fill="#6b7280" text-anchor="middle">Source of truth: docs/architecture/agent_task_contract.md (Sections 4–7) · src/agent/state.py · src/tools/registry.py · Week 5 (28 Sep – 2 Oct 2026)</text>
</svg>