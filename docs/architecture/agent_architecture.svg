<text x="980.0" y="412" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="600">RETRIEVE_KNOWLEDGE / EXECUTE_TOOL</text>
<path d="M980.0,758 L980.0,814 " fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="924.78" y="763.5" width="110.44000000000001" height="18.5" fill="#ffffff" opacity="0.95"/>
<text x="980.0" y="776" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="600">tool observation</text>
<path d="M860.0,862.0 L1100.0,862.0 " fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="869.4075" y="837.5" width="221.185" height="18.5" fill="#ffffff" opacity="0.95"/>
<text x="980.0" y="850.0" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="600">tool failed · retry eligible (R-6)</text>
<path d="M620.0,910 L620.0,1016.0 L700.0,1016.0 " fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="472.49249999999995" y="915.5" width="295.01500000000004" height="18.5" fill="#ffffff" opacity="0.95"/>
<text x="620.0" y="928" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="600">G1–G6 met, no failures (or S4 iteration limit)</text>
<path d="M1340.0,910 L1340.0,1016.0 L1260.0,1016.0 " fill="none" stroke="#b9453f" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow-crimson)"/>
<rect x="1250.94125" y="915.5" width="178.1175" height="18.5" fill="#ffffff" opacity="0.95"/>
<text x="1340.0" y="928" font-size="11.5" fill="#8a2a24" text-anchor="middle" font-weight="600">2nd failure → escalate (S5)</text>
<path d="M380.0,834 L170.0,834 L170.0,346.0 L700.0,346.0 " fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="176.71249999999998" y="809.5" width="196.57500000000002" height="18.5" fill="#ffffff" opacity="0.95"/>
<text x="275.0" y="822" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="600">continue · iteration_count &lt; 5</text>
<path d="M640.0,206.0 L90.0,206.0 L90.0,1016.0 L700.0,1016.0 " fill="none" stroke="#b9453f" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow-crimson)"/>
<rect x="208.26375" y="181.5" width="313.4725" height="18.5" fill="#ffffff" opacity="0.95"/>
<text x="365.0" y="194.0" font-size="11.5" fill="#8a2a24" text-anchor="middle" font-weight="600">S1 prohibited intent — iteration 0, no tool calls</text>
<path d="M1580.0,836 L1790.0,836 L1790.0,736 L1730.0,736 " fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1608.24625" y="811.5" width="153.50750000000002" height="18.5" fill="#ffffff" opacity="0.95"/>
<text x="1685.0" y="824" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="600">retry same tool · max 1</text>
<path d="M1260.0,346.0 L1880.0,346.0 L1880.0,1016.0 L1260.0,1016.0 " fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1468.63625" y="321.5" width="202.72750000000002" height="18.5" fill="#ffffff" opacity="0.95"/>
<text x="1570.0" y="334.0" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="600">FINAL_SYNTHESIS (T6) / ESCALATE</text>
<rect x="40" y="1090" width="6" height="36" fill="#2f7a97"/>
<text x="56" y="1106" font-size="16.5" font-weight="700" fill="#111827">2  TERMINAL STATE TRANSITIONS — AgentStatus</text>
<text x="56" y="1123" font-size="12" fill="#6b7280">running is the only non-terminal status · every other transition out of a terminal status is invalid (StateSealedError)</text>
<rect x="230.0" y="1146" width="460" height="80" rx="8" fill="#163c28" stroke="#3a8a5c" stroke-width="1.5"/>
<text x="460.0" y="1180.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">SUCCESS</text>
<text x="460.0" y="1202.5" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">G1–G6 all met · zero tool failures (N1, N2)</text>
<rect x="750.0" y="1146" width="460" height="80" rx="8" fill="#6b4318" stroke="#c78a36" stroke-width="1.5"/>
<text x="980.0" y="1180.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">RECOVERED</text>
<text x="980.0" y="1202.5" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">≥ 1 tool failure, retry or fallback worked (N3)</text>
<rect x="1270.0" y="1146" width="460" height="80" rx="8" fill="#5c1b1b" stroke="#b9453f" stroke-width="1.5"/>
<text x="1500.0" y="1180.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ESCALATED</text>
<text x="1500.0" y="1202.5" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">Stop condition S1–S11 fired · human must act (H-3)</text>
<path d="M980.0,1060 L980.0,1096 L460.0,1096 L460.0,1146 " fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#arrow)"/>
