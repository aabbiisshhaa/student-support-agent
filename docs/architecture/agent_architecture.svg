<text x="980.0" y="40" font-size="25" font-weight="700" fill="#111827" text-anchor="middle">University Student-Support Case Agent — Week 5 Agent Architecture</text>
<text x="980.0" y="63" font-size="14" fill="#6b7280" text-anchor="middle">Course Retake &amp; Timetable Conflict Resolution workflow · Sense → Plan → Act → Observe → Re-plan / Stop · AI Safety Impact: Deterministic Code</text>
<rect x="40" y="92" width="6" height="36" fill="#2f7a97"/>
<text x="56" y="108" font-size="16.5" font-weight="700" fill="#111827">1  BOUNDED CONTROL LOOP</text>
<text x="56" y="125" font-size="12" fill="#6b7280">src/agent/orchestrator.py + src/agent/state.py (AgentStep, ALLOWED_STEP_TRANSITIONS) · max_iterations=5 · max_replans=2 · retries/tool=1</text>
<rect x="640.0" y="156" width="680" height="100" rx="8" fill="#123b4a" stroke="#2f7a97" stroke-width="1.5"/>
<text x="980.0" y="191.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">SENSE</text>
<text x="980.0" y="213.0" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">Validate session_id, student_id (session-bound), user_query (≤ 2000 chars), retake_course_code</text>
<text x="980.0" y="232.0" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">Prohibited-intent screen runs here, before any tool call (PROHIBITED_INTENTS)</text>
<rect x="700.0" y="298" width="560" height="96" rx="8" fill="#5a2233" stroke="#a8536c" stroke-width="1.5"/>
<text x="980.0" y="331.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">PLAN — _plan_next_step()</text>
<text x="980.0" y="353.0" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">Chooses exactly one action: RETRIEVE_KNOWLEDGE · EXECUTE_TOOL ·</text>
<text x="980.0" y="372.0" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">FINAL_SYNTHESIS · ESCALATE</text>
<rect x="230.0" y="436" width="1500" height="322" rx="8" fill="#163c28" stroke="#3a8a5c" stroke-width="1.5"/>
<text x="980.0" y="463.5" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle">ACT — tool_registry.execute(tool_name, params)</text>
<text x="980.0" y="486.0" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">src/tools/registry.py — execution allow-list + parameter schema boundary. Only the tools below are reachable from a plan.</text>
<rect x="270.0" y="502" width="457.3333333333333" height="76" rx="6" fill="#0f3a2a" stroke="#3a8a5c" stroke-width="1.3"/>
<text x="498.66666666666663" y="527.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">T1 · retriever.retrieve()</text>
<text x="498.66666666666663" y="545.5" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">RETRIEVE_KNOWLEDGE · read-only</text>
<text x="498.66666666666663" y="561.8" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">top_k=2, approved corpus only</text>
<rect x="751.3333333333333" y="502" width="457.3333333333333" height="76" rx="6" fill="#0f3a2a" stroke="#3a8a5c" stroke-width="1.3"/>
<text x="979.9999999999999" y="527.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">T2 · get_course_schedule()</text>
<text x="979.9999999999999" y="545.5" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">EXECUTE_TOOL · read-only</text>
<text x="979.9999999999999" y="561.8" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">own student_id only (Rule I-1)</text>
<rect x="1232.6666666666665" y="502" width="457.3333333333333" height="76" rx="6" fill="#0f3a2a" stroke="#3a8a5c" stroke-width="1.3"/>
<text x="1461.3333333333333" y="527.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">T3 · get_course_offering()</text>
<text x="1461.3333333333333" y="545.5" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">EXECUTE_TOOL · read-only</text>
<text x="1461.3333333333333" y="561.8" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">planned — same schema style as T2</text>
<rect x="270.0" y="598" width="457.3333333333333" height="76" rx="6" fill="#17314a" stroke="#2f7a97" stroke-width="1.3"/>
<text x="498.66666666666663" y="623.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">T4 · detect_schedule_conflicts()</text>
<text x="498.66666666666663" y="641.5" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">runs inside OBSERVE, not planner-selected</text>
<text x="498.66666666666663" y="657.8" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">pure function, after T2+T3 ok</text>
<rect x="751.3333333333333" y="598" width="457.3333333333333" height="76" rx="6" fill="#5c1b1b" stroke="#d2665f" stroke-width="1.3"/>
<text x="979.9999999999999" y="623.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">T5 · create_support_ticket() — WRITE</text>
<text x="979.9999999999999" y="641.5" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">only tool with side effects (R-T1)</text>
<text x="979.9999999999999" y="657.8" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">needs student_confirmed==true · final action only</text>
<rect x="1232.6666666666665" y="598" width="457.3333333333333" height="76" rx="6" fill="#0f3a2a" stroke="#3a8a5c" stroke-width="1.3"/>
<text x="1461.3333333333333" y="623.0" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">T6 · final response synthesis</text>
<text x="1461.3333333333333" y="641.5" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">FINAL_SYNTHESIS · Gemini or deterministic formatter</text>
<text x="1461.3333333333333" y="657.8" font-size="10.8" font-weight="400" fill="#dfe2e6" text-anchor="middle">grounded only in evidence + tool results</text>
<rect x="270.0" y="694" width="1420" height="54" rx="6" fill="#3a1414" stroke="#b9453f" stroke-width="1.3" stroke-dasharray="5,3"/>
<text x="980.0" y="724.2" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">✗ Any unlisted tool name → {"error": "Tool '&lt;name&gt;' not recognized."} — rejected before execution, counted as a FAILED step (S11 if repeated)</text>
<rect x="380.0" y="814" width="480" height="96" rx="8" fill="#123b4a" stroke="#2f7a97" stroke-width="1.5"/>
<text x="620.0" y="847.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">OBSERVE</text>
<text x="620.0" y="869.0" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">Records the outcome · runs T4 once both schedules exist · checks</text>
<text x="620.0" y="888.0" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">G1–G6 and stop conditions</text>
<rect x="1100.0" y="814" width="480" height="96" rx="8" fill="#6b4318" stroke="#c78a36" stroke-width="1.5"/>
<text x="1340.0" y="847.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">REPLAN</text>
<text x="1340.0" y="869.0" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">Retries a failed read-only tool (T1–T3) once with the same</text>
<text x="1340.0" y="888.0" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">arguments (R-6); max_replans=2</text>
<rect x="700.0" y="972" width="560" height="88" rx="8" fill="#2b2f36" stroke="#6b7280" stroke-width="1.5"/>
<text x="980.0" y="1010.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">STOP — AgentState.finish()</text>
<text x="980.0" y="1032.5" font-size="12.5" font-weight="400" fill="#dfe2e6" text-anchor="middle">Terminal · the state is sealed · no further plan, act or observe is possible</text>
